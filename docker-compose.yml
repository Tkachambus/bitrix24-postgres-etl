services:
  db:
    image: postgres:16
    container_name: etl_demo_db
    environment:
      POSTGRES_DB: analytics_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics_dw"]
      interval: 5s
      timeout: 3s
      retries: 20

  sync:
    build: ./sync-b24
    container_name: etl_demo_sync
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
